<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Looker: Visible Monitor</title>
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: #fff;
            font-family: monospace;
            height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
            cursor: none; 
        }

        #stage {
            width: 512px; height: 512px;
            max-width: 95vw; max-height: 95vh;
            box-shadow: 0 0 50px #333;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            filter: blur(10px);
            transition: filter 1s ease-out;
            position: relative;
        }
        
        #stage.loaded { filter: blur(0); }
        canvas { display: block; width: 100%; height: 100%; }

        /* [强制显示] 监控面板 */
        .monitor {
            /* 使用 fixed 强制固定在浏览器窗口窗口，无视文档流 */
            position: fixed; 
            top: 20px; left: 20px;
            
            /* 层级设为极高 */
            z-index: 999999; 
            
            /* 高对比度样式 */
            background-color: #ffffff; 
            color: #000000;
            
            /* 为了测试，暂时加一个红色粗边框 */
            border: 4px solid #ff0000; 
            
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }
        
        .monitor-row { margin-bottom: 5px; display: flex; align-items: center; }
        .monitor span { color: #d946ef; margin-left: 5px; } 

        .led {
            display: inline-block; width: 12px; height: 12px; 
            border-radius: 50%; margin-right: 10px; border: 1px solid #999;
        }
        .led.active { background-color: #16a34a; box-shadow: 0 0 8px #16a34a; animation: pulse 1s infinite; }
        .led.idle { background-color: #ea580c; box-shadow: 0 0 8px #ea580c; animation: pulse 2s infinite; }

        @keyframes pulse {
            0% { transform: scale(1); } 50% { transform: scale(1.2); } 100% { transform: scale(1); }
        }

        #loading {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 20px; z-index: 1000;
            background: #000; padding: 20px; border: 1px solid #fff;
        }
    </style>
</head>
<body>

<div class="monitor">
    <div class="monitor-row">
        <div class="led active" id="status-dot"></div>
        STATUS: <span id="status-text" style="color:#000;">INIT</span>
    </div>
    <div class="monitor-row">
        VERSION: <span>FIXED_UI</span>
    </div>
    <div class="monitor-row">
        SMOOTH: <span>0.08</span>
    </div>
</div>

<div id="loading">LOADING...</div>

<div id="stage">
    <canvas id="canvas"></canvas>
</div>

<script>
    const CONFIG = {
        imageSrc: './example_grid.webp', 
        rows: 11, cols: 11,
        smoothing: 0.08, 
        idleTime: 2000 
    };

    let gridImg = null;
    let frameW = 0, frameH = 0;
    let targetX = 0.5, targetY = 0.5;
    let currentX = 0.5, currentY = 0.5;
    let lastIndex = -1;
    let idleTimer = null;
    
    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const loading = document.getElementById('loading');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');

    window.onload = function() {
        console.log("Script Loaded"); // 调试信息
        gridImg = new Image();
        gridImg.src = CONFIG.imageSrc;

        gridImg.onload = () => {
            console.log("Image Loaded");
            loading.style.display = 'none';
            stage.classList.add('loaded');
            
            frameW = gridImg.width / CONFIG.cols;
            frameH = gridImg.height / CONFIG.rows;
            resizeStage(frameW, frameH);
            
            requestAnimationFrame(animateLoop);
            
            window.addEventListener('mousemove', handleInput);
            window.addEventListener('resize', () => resizeStage(frameW, frameH));
            
            updateStatus('ACTIVE');
            resetIdleTimer();
        };

        gridImg.onerror = () => {
            loading.innerText = "ERROR: image not found";
            loading.style.backgroundColor = "red";
        };
    };

    function handleInput(e) {
        let rx = e.clientX / window.innerWidth;
        let ry = e.clientY / window.innerHeight;
        ry = 1.0 - ry; 
        targetX = rx; targetY = ry;
        updateStatus('ACTIVE');
        resetIdleTimer();
    }

    function resetIdleTimer() {
        if (idleTimer) clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            targetX = 0.5; targetY = 0.5;
            updateStatus('IDLE');
        }, CONFIG.idleTime);
    }

    function updateStatus(state) {
        statusText.innerText = state;
        if (state.includes('IDLE')) {
            statusDot.className = 'led idle';
            statusText.style.color = '#ea580c';
        } else {
            statusDot.className = 'led active';
            statusText.style.color = '#16a34a';
        }
    }

    function animateLoop() {
        currentX += (targetX - currentX) * CONFIG.smoothing;
        currentY += (targetY - currentY) * CONFIG.smoothing;

        let col = Math.floor(currentX * CONFIG.cols);
        let row = Math.floor(currentY * CONFIG.rows);
        col = Math.max(0, Math.min(col, CONFIG.cols - 1));
        row = Math.max(0, Math.min(row, CONFIG.rows - 1));

        const index = row * CONFIG.cols + col;
        if (index !== lastIndex) {
            renderFrame(index);
            lastIndex = index;
        }
        requestAnimationFrame(animateLoop);
    }

    function renderFrame(index) {
        const col = index % CONFIG.cols;
        const row = Math.floor(index / CONFIG.cols);
        const sx = col * frameW;
        const sy = row * frameH;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(gridImg, Math.floor(sx), Math.floor(sy), Math.floor(frameW), Math.floor(frameH), 0, 0, canvas.width, canvas.height);
    }

    function resizeStage(w, h) {
        if (!w || !h) return;
        const ratio = w / h;
        const maxW = window.innerWidth * 0.95;
        const maxH = window.innerHeight * 0.95;
        let finalW = w, finalH = h;
        if (finalH > maxH) { finalH = maxH; finalW = finalH * ratio; }
        if (finalW > maxW) { finalW = maxW; finalH = finalW / ratio; }
        stage.style.width = finalW + 'px';
        stage.style.height = finalH + 'px';
        canvas.width = w; canvas.height = h;
        lastIndex = -1; 
    }
</script>
</body>
</html>
