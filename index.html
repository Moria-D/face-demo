<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Looker AI: Generate & Interact</title>
    <style>
        /* 全局样式 */
        body {
            margin: 0; padding: 0; background-color: #050505; color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 生成器面板 (上传前显示) */
        #generator-panel {
            position: absolute; z-index: 200;
            background: rgba(20, 20, 20, 0.95); border: 1px solid #333;
            padding: 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transition: opacity 0.5s, transform 0.5s;
        }
        
        h1 { margin: 0 0 10px 0; font-size: 24px; background: linear-gradient(45deg, #fff, #888); -webkit-background-clip: text; color: transparent; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }

        .upload-btn {
            background: #2563eb; color: white; border: none; padding: 12px 30px;
            border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .upload-btn:hover { transform: scale(1.05); background: #3b82f6; box-shadow: 0 0 20px rgba(37, 99, 235, 0.4); }
        .upload-btn:disabled { background: #444; cursor: not-allowed; transform: none; box-shadow: none; }

        /* 舞台 (生成后显示) */
        #stage {
            width: 512px; height: 512px;
            max-width: 95vw; max-height: 95vh;
            border-radius: 12px; overflow: hidden;
            background: #000;
            opacity: 0; transform: scale(0.9); /* 初始隐藏 */
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }
        
        #stage.active { opacity: 1; transform: scale(1); }
        canvas { display: block; width: 100%; height: 100%; }

        /* 状态标记 */
        .status-badge {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: #fff; color: #000; padding: 6px 12px; border-radius: 6px;
            font-family: monospace; font-weight: bold; font-size: 12px;
            pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }

        /* 加载动画 */
        .loader {
            width: 20px; height: 20px; border: 3px solid #fff; border-bottom-color: transparent;
            border-radius: 50%; display: none; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* === 历史记录侧边栏 === */
        #history-btn {
            position: absolute; top: 20px; right: 20px; z-index: 300;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: #ccc; padding: 8px 12px; border-radius: 8px; cursor: pointer;
            font-size: 12px; backdrop-filter: blur(10px); transition: all 0.2s;
        }
        #history-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

        #history-panel {
            position: fixed; top: 0; right: -300px; width: 280px; height: 100vh;
            background: rgba(10, 10, 10, 0.95); border-left: 1px solid #333;
            z-index: 400; transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            padding: 20px; overflow-y: auto; box-shadow: -10px 0 30px rgba(0,0,0,0.5);
        }
        #history-panel.open { right: 0; }
        
        .history-item {
            margin-bottom: 15px; cursor: pointer;
            border: 1px solid #333; border-radius: 8px; overflow: hidden;
            transition: all 0.2s; opacity: 0.8;
        }
        .history-item:hover { transform: translateY(-2px); border-color: #666; opacity: 1; }
        .history-item img { width: 100%; display: block; height: 100px; object-fit: cover; }
        .history-meta { padding: 8px; font-size: 10px; color: #888; background: #1a1a1a; }
        
        .close-btn { 
            float: right; cursor: pointer; color: #666; font-size: 18px; margin-top: -5px; 
        }
        .close-btn:hover { color: #fff; }

    </style>
</head>
<body>

<!-- 历史记录开关 -->
<div id="history-btn" onclick="toggleHistory()">📂 历史记录</div>

<!-- 历史记录面板 -->
<div id="history-panel">
    <div style="margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0; font-size: 16px;">已生成模型</h3>
        <span class="close-btn" onclick="toggleHistory()">×</span>
    </div>
    <div id="history-list">
        <div style="text-align: center; color: #444; margin-top: 50px;">加载中...</div>
    </div>
</div>

<div id="generator-panel">
    <h1>Face Looker AI</h1>
    <p>上传一张人像照片，AI 将自动生成视线交互模型</p>
    
    <button class="upload-btn" onclick="document.getElementById('file-input').click()" id="btn-main">
        <span class="loader" id="loader"></span>
        <span id="btn-text">上传照片 & 开始生成</span>
    </button>
    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleUpload(event)">
    
    <div style="margin-top: 15px; font-size: 12px; color: #888; line-height: 1.6;" id="status-msg">
        需自备 Replicate API Token<br>
        (生成约需 60-90秒)
    </div>

    <!-- 加载本地/历史图片输入框 (保留作为备用) -->
    <div style="margin-top: 20px; border-top: 1px solid #333; padding-top: 20px;">
        <p style="margin-bottom: 10px; font-size: 12px;">或加载已生成的 Grid 图：</p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <input type="text" id="local-url-input" placeholder="输入路径 (如 /outputs/grid_xxx.webp)" 
                   style="background: #222; border: 1px solid #444; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 12px; width: 200px;">
            <button onclick="loadLocalImage()" 
                    style="background: #333; color: white; border: 1px solid #555; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 12px;">
                加载
            </button>
        </div>
    </div>
</div>

<div class="status-badge" id="monitor">LIVE INTERACTION</div>
<div id="stage">
    <canvas id="canvas"></canvas>
</div>

<script>
    // === 核心逻辑配置 ===
    // 注意：默认配置为 7x7 (适配新版 step=5)
    // 但我们会尝试自动检测 11x11 的旧图
    let CONFIG = {
        rows: 7, cols: 7, 
        smoothing: 0.1,
        idleTime: 3000,
        idleSmoothing: 0.02
    };

    let gridImg = null;
    let frameW = 0, frameH = 0;
    
    // 物理状态
    let targetX = 0.5, targetY = 0.5;
    let currentX = 0.5, currentY = 0.5;
    let lastIndex = -1;
    let idleTimer = null;
    let isIdle = false; 

    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const panel = document.getElementById('generator-panel');
    const btnMain = document.getElementById('btn-main');
    const btnText = document.getElementById('btn-text');
    const loader = document.getElementById('loader');
    const statusMsg = document.getElementById('status-msg');
    const monitor = document.getElementById('monitor');
    const historyPanel = document.getElementById('history-panel');

    // === 历史记录功能 ===
    let isHistoryLoaded = false;

    function toggleHistory() {
        historyPanel.classList.toggle('open');
        if (historyPanel.classList.contains('open') && !isHistoryLoaded) {
            fetchHistory();
        }
    }

    async function fetchHistory() {
        const listDiv = document.getElementById('history-list');
        try {
            const res = await fetch('/api/history');
            const files = await res.json();
            
            if (files.length === 0) {
                listDiv.innerHTML = '<div style="text-align: center; color: #444; margin-top: 50px;">暂无记录</div>';
                return;
            }

            listDiv.innerHTML = files.map(file => `
                <div class="history-item" onclick="loadFromHistory('${file.url}')">
                    <img src="${file.url}" loading="lazy">
                    <div class="history-meta">${file.time}</div>
                </div>
            `).join('');
            
            isHistoryLoaded = true;
        } catch (e) {
            listDiv.innerHTML = '<div style="color: red; text-align: center;">加载失败</div>';
        }
    }

    function loadFromHistory(url) {
        toggleHistory(); 
        statusMsg.innerText = "正在从历史记录加载...";
        initInteraction(url);
    }

    async function handleUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        setLoading(true);
        statusMsg.innerHTML = "正在调度 GPU 集群生成视线模型...<br>请耐心等待 (预计 60s)";
        statusMsg.style.color = "#4ade80"; 

        const formData = new FormData();
        formData.append('image', file);

        try {
            const response = await fetch('/api/generate', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                if (data.error && data.error.includes("429")) {
                    throw new Error("API 调用过于频繁，请休息 1 分钟后再试");
                }
                throw new Error(data.error || "服务器未知错误");
            }
            
            if (!data.grid_url) throw new Error("未返回 Grid URL");

            statusMsg.innerHTML = "生成完毕！正在下载高清纹理...";
            
            initInteraction(data.grid_url);
            isHistoryLoaded = false; 

        } catch (err) {
            console.error(err);
            statusMsg.innerText = "错误: " + err.message;
            statusMsg.style.color = "#ef4444";
            setLoading(false);
        }
    }

    function setLoading(isLoading) {
        btnMain.disabled = isLoading;
        loader.style.display = isLoading ? 'inline-block' : 'none';
        btnText.innerText = isLoading ? '正在处理...' : '上传照片 & 开始生成';
    }

    function loadLocalImage() {
        const input = document.getElementById('local-url-input');
        const url = input.value.trim();
        if (!url) {
            alert("请输入图片路径");
            return;
        }
        const finalUrl = url.startsWith('/') || url.startsWith('http') ? url : '/outputs/' + url;
        statusMsg.innerText = "正在加载历史图片...";
        initInteraction(finalUrl);
    }

    // 2. 初始化交互引擎
    function initInteraction(imageUrl) {
        gridImg = new Image();
        gridImg.crossOrigin = "Anonymous"; 
        gridImg.src = imageUrl;

        gridImg.onload = () => {
            // === 智能检测网格尺寸 (修正版) ===
            const w = gridImg.width;
            console.log(`Grid Image Loaded. Width: ${w}px`);
            
            // 优先判断能否被 11 整除 (旧版模型通常输出 256x256 * 11 = 2816 或 512x512 * 11 = 5632)
            if (w % 11 === 0) {
                console.log("Width is divisible by 11. Setting layout to 11x11.");
                CONFIG.rows = 11;
                CONFIG.cols = 11;
            } 
            // 其次判断能否被 7 整除 (新版 step=5 输出)
            else if (w % 7 === 0) {
                console.log("Width is divisible by 7. Setting layout to 7x7.");
                CONFIG.rows = 7;
                CONFIG.cols = 7;
            }
            // 兜底逻辑：如果都除不尽，或者都除得尽，根据大小猜
            else {
                console.warn("Cannot detect layout automatically. Defaulting to 7x7.");
                CONFIG.rows = 7;
                CONFIG.cols = 7;
            }

            // 隐藏面板，显示舞台
            panel.style.opacity = 0;
            panel.style.pointerEvents = 'none';
            stage.classList.add('active');
            monitor.style.opacity = 1;

            frameW = gridImg.width / CONFIG.cols;
            frameH = gridImg.height / CONFIG.rows;
            resizeStage(frameW, frameH);

            requestAnimationFrame(animateLoop);
            
            window.addEventListener('mousemove', handleInput);
            window.addEventListener('touchmove', handleInput); 
            window.addEventListener('resize', () => resizeStage(frameW, frameH));
            
            resetIdleTimer();
        };
    }

    function handleInput(e) {
        let clientX, clientY;
        
        if (e.touches) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
            e.preventDefault(); 
        } else {
            clientX = e.clientX;
            clientY = e.clientY;
        }

        let rx = clientX / window.innerWidth;
        let ry = clientY / window.innerHeight;
        
        rx = Math.max(0, Math.min(1, rx));
        ry = Math.max(0, Math.min(1, ry));

        ry = 1.0 - ry; 
        
        targetX = rx; targetY = ry;
        isIdle = false;
        resetIdleTimer();
    }

    function resetIdleTimer() {
        if (idleTimer) clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            targetX = 0.5; targetY = 0.5;
            isIdle = true; 
        }, CONFIG.idleTime);
    }

    function animateLoop() {
        const factor = isIdle ? CONFIG.idleSmoothing : CONFIG.smoothing;

        currentX += (targetX - currentX) * factor;
        currentY += (targetY - currentY) * factor;

        let col = Math.min(Math.floor(currentX * CONFIG.cols), CONFIG.cols - 1);
        let row = Math.min(Math.floor(currentY * CONFIG.rows), CONFIG.rows - 1);

        const index = row * CONFIG.cols + col;
        if (index !== lastIndex) {
            renderFrame(index);
            lastIndex = index;
        }
        requestAnimationFrame(animateLoop);
    }

    function renderFrame(index) {
        const col = index % CONFIG.cols;
        const row = Math.floor(index / CONFIG.cols);
        const sx = col * frameW;
        const sy = row * frameH;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(gridImg, Math.floor(sx), Math.floor(sy), Math.floor(frameW), Math.floor(frameH), 0, 0, canvas.width, canvas.height);
    }

    function resizeStage(w, h) {
        const ratio = w / h;
        const maxW = window.innerWidth * 0.9;
        const maxH = window.innerHeight * 0.9;
        let finalW = w, finalH = h;
        if (finalH > maxH) { finalH = maxH; finalW = finalH * ratio; }
        if (finalW > maxW) { finalW = maxW; finalH = finalW / ratio; }
        stage.style.width = finalW + 'px';
        stage.style.height = finalH + 'px';
        canvas.width = w; canvas.height = h;
        lastIndex = -1;
    }
</script>
</body>
</html>
