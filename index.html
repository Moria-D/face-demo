<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Looker: Auto Load</title>
    <style>
        /* 1. 极简黑色背景 */
        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
            cursor: none; /* 可选：隐藏鼠标指针，增加沉浸感 */
        }

        /* 2. 舞台容器 */
        #stage {
            /* 初始尺寸，会被 JS 自动覆盖 */
            width: 512px; height: 512px;
            
            /* 保持比例响应式缩放，但不超过屏幕 */
            max-width: 95vw; max-height: 95vh;
            
            /* 居中样式 */
            box-shadow: 0 0 80px rgba(0,0,0,0.9);
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
            width: 100%; height: 100%;
        }

        /* 加载提示 */
        #loading {
            position: absolute;
            color: #666; font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div id="loading">正在加载 example_grid.webp ...</div>

<div id="stage">
    <canvas id="canvas"></canvas>
</div>

<script>
    // === 配置区域 ===
    const CONFIG = {
        // 这里写死您的文件名
        // 请确保该文件就在 index.html 旁边，且通过 localhost:8000 访问
        imageSrc: './example_grid.webp', 
        rows: 11,
        cols: 11
    };

    let gridImg = null;
    let frameW = 0, frameH = 0;
    
    // 缓存上一帧索引，优化性能
    let lastIndex = -1;

    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const loading = document.getElementById('loading');

    // 1. 页面加载完毕自动执行
    window.onload = function() {
        loadAndInit();
    };

    function loadAndInit() {
        gridImg = new Image();
        gridImg.src = CONFIG.imageSrc;

        gridImg.onload = () => {
            loading.style.display = 'none'; // 隐藏加载提示

            // 计算单帧尺寸
            frameW = gridImg.width / CONFIG.cols;
            frameH = gridImg.height / CONFIG.rows;
            
            // 调整舞台大小以适应单帧比例
            resizeStage(frameW, frameH);
            
            // 默认显示中间帧
            renderFrame(Math.floor((CONFIG.rows * CONFIG.cols) / 2));
            
            // 启动交互监听
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('resize', () => resizeStage(frameW, frameH));
        };

        gridImg.onerror = () => {
            loading.innerText = "错误：找不到 example_grid.webp，请检查文件名或路径。";
            loading.style.color = "red";
        };
    }

    // 2. 交互逻辑 (已固化反转Y轴)
    function handleMove(e) {
        if (!gridImg) return;

        // 获取归一化坐标 (0.0 - 1.0)
        let rx = e.clientX / window.innerWidth;
        let ry = e.clientY / window.innerHeight;

        // --- 核心逻辑：默认反转 Y 轴 ---
        // 这样鼠标往上(Y变小)，视线也会往上(读取 Grid 后面的行)
        ry = 1.0 - ry;

        // 映射到行列索引
        let col = Math.floor(rx * CONFIG.cols);
        let row = Math.floor(ry * CONFIG.rows);

        // 边界限制
        col = Math.max(0, Math.min(col, CONFIG.cols - 1));
        row = Math.max(0, Math.min(row, CONFIG.rows - 1));

        const index = row * CONFIG.cols + col;
        
        // 只有画面变化才重绘
        if (index !== lastIndex) {
            renderFrame(index);
            lastIndex = index;
        }
    }

    // 3. 渲染单帧
    function renderFrame(index) {
        const col = index % CONFIG.cols;
        const row = Math.floor(index / CONFIG.cols);

        const sx = col * frameW;
        const sy = row * frameH;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // 裁剪并绘制
        ctx.drawImage(
            gridImg, 
            sx, sy, frameW, frameH, 
            0, 0, canvas.width, canvas.height
        );
    }

    // 4. 自适应舞台大小
    function resizeStage(w, h) {
        if (!w || !h) return;
        const ratio = w / h;
        const maxW = window.innerWidth * 0.95;
        const maxH = window.innerHeight * 0.95;

        let finalW = w;
        let finalH = h;

        // 缩放适应屏幕
        if (finalH > maxH) {
            finalH = maxH;
            finalW = finalH * ratio;
        }
        if (finalW > maxW) {
            finalW = maxW;
            finalH = finalW / ratio;
        }

        stage.style.width = finalW + 'px';
        stage.style.height = finalH + 'px';
        canvas.width = w;
        canvas.height = h;

        // 重绘以防变形
        if (lastIndex >= 0) renderFrame(lastIndex);
    }
</script>
</body>
</html>
