<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Looker AI: Generate & Interact</title>
    <style>
        /* 全局样式 */
        body {
            margin: 0; padding: 0; background-color: #050505; color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* 生成器面板 (上传前显示) */
        #generator-panel {
            position: absolute; z-index: 200;
            background: rgba(20, 20, 20, 0.95); border: 1px solid #333;
            padding: 40px; border-radius: 20px; text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            transition: opacity 0.5s, transform 0.5s;
        }
        
        h1 { margin: 0 0 10px 0; font-size: 24px; background: linear-gradient(45deg, #fff, #888); -webkit-background-clip: text; color: transparent; }
        p { color: #666; font-size: 14px; margin-bottom: 30px; }

        .upload-btn {
            background: #2563eb; color: white; border: none; padding: 12px 30px;
            border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .upload-btn:hover { transform: scale(1.05); background: #3b82f6; box-shadow: 0 0 20px rgba(37, 99, 235, 0.4); }
        .upload-btn:disabled { background: #444; cursor: not-allowed; transform: none; box-shadow: none; }

        /* 舞台 (生成后显示) */
        #stage {
            width: 512px; height: 512px;
            max-width: 95vw; max-height: 95vh;
            border-radius: 12px; overflow: hidden;
            background: #000;
            opacity: 0; transform: scale(0.9); /* 初始隐藏 */
            transition: all 1s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 100px rgba(0,0,0,0.8);
        }
        
        #stage.active { opacity: 1; transform: scale(1); }
        canvas { display: block; width: 100%; height: 100%; }

        /* 状态标记 */
        .status-badge {
            position: absolute; top: 20px; left: 20px; z-index: 100;
            background: #fff; color: #000; padding: 6px 12px; border-radius: 6px;
            font-family: monospace; font-weight: bold; font-size: 12px;
            pointer-events: none; opacity: 0; transition: opacity 0.5s;
        }

        /* 加载动画 */
        .loader {
            width: 20px; height: 20px; border: 3px solid #fff; border-bottom-color: transparent;
            border-radius: 50%; display: none; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    </style>
</head>
<body>

<div id="generator-panel">
    <h1>Face Looker AI</h1>
    <p>上传一张人像照片，AI 将自动生成视线交互模型</p>
    
    <button class="upload-btn" onclick="document.getElementById('file-input').click()" id="btn-main">
        <span class="loader" id="loader"></span>
        <span id="btn-text">上传照片 & 开始生成</span>
    </button>
    <input type="file" id="file-input" accept="image/*" style="display:none" onchange="handleUpload(event)">
    
    <div style="margin-top: 15px; font-size: 12px; color: #888; line-height: 1.6;" id="status-msg">
        需自备 Replicate API Token<br>
        (生成 121 个角度约需 60-90秒)
    </div>
</div>

<div class="status-badge" id="monitor">LIVE INTERACTION</div>
<div id="stage">
    <canvas id="canvas"></canvas>
</div>

<script>
    // === 核心逻辑配置 ===
    const CONFIG = {
        rows: 11, cols: 11,
        smoothing: 0.1,  // 稍微调高平滑系数，让跟随更跟手
        idleTime: 3000,   // 闲置3秒后归位
        idleSmoothing: 0.02 // 归位时更慢，显得更自然
    };

    let gridImg = null;
    let frameW = 0, frameH = 0;
    
    // 物理状态
    let targetX = 0.5, targetY = 0.5;
    let currentX = 0.5, currentY = 0.5;
    let lastIndex = -1;
    let idleTimer = null;
    let isIdle = false; // 标记是否处于待机状态

    const stage = document.getElementById('stage');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const panel = document.getElementById('generator-panel');
    const btnMain = document.getElementById('btn-main');
    const btnText = document.getElementById('btn-text');
    const loader = document.getElementById('loader');
    const statusMsg = document.getElementById('status-msg');
    const monitor = document.getElementById('monitor');

    // 1. 处理上传并调用后端 API
    async function handleUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        // UI 状态更新
        setLoading(true);
        statusMsg.innerHTML = "正在调度 GPU 集群生成 121 个视线角度...<br>请耐心等待，不要关闭页面 (预计 60s)";
        statusMsg.style.color = "#4ade80"; // Green light

        const formData = new FormData();
        formData.append('image', file);

        try {
            // 调用我们写的 Python 后端
            const response = await fetch('/api/generate', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (!response.ok) {
                if (data.error && data.error.includes("429")) {
                    throw new Error("API 调用过于频繁，请休息 1 分钟后再试");
                }
                throw new Error(data.error || "服务器未知错误");
            }
            
            if (!data.grid_url) throw new Error("未返回 Grid URL");

            statusMsg.innerHTML = "生成完毕！正在下载高清纹理...";
            
            // 拿到 URL 后初始化交互引擎
            initInteraction(data.grid_url);

        } catch (err) {
            console.error(err);
            statusMsg.innerText = "错误: " + err.message;
            statusMsg.style.color = "#ef4444";
            setLoading(false);
        }
    }

    function setLoading(isLoading) {
        btnMain.disabled = isLoading;
        loader.style.display = isLoading ? 'inline-block' : 'none';
        btnText.innerText = isLoading ? '正在处理...' : '上传照片 & 开始生成';
    }

    // 2. 初始化交互引擎 (P0 Version)
    function initInteraction(imageUrl) {
        gridImg = new Image();
        gridImg.crossOrigin = "Anonymous"; // 允许跨域
        gridImg.src = imageUrl;

        gridImg.onload = () => {
            // 隐藏面板，显示舞台
            panel.style.opacity = 0;
            panel.style.pointerEvents = 'none';
            stage.classList.add('active');
            monitor.style.opacity = 1;

            // 计算尺寸
            frameW = gridImg.width / CONFIG.cols;
            frameH = gridImg.height / CONFIG.rows;
            resizeStage(frameW, frameH);

            // 启动循环
            requestAnimationFrame(animateLoop);
            
            // 绑定事件
            window.addEventListener('mousemove', handleInput);
            window.addEventListener('resize', () => resizeStage(frameW, frameH));
            
            // 初始归位
            resetIdleTimer();
        };
    }

    // 3. 物理引擎
    function handleInput(e) {
        let rx = e.clientX / window.innerWidth;
        let ry = e.clientY / window.innerHeight;
        
        // 修正逻辑：确保能取到 0.0 和 1.0 的边缘值
        // 之前可能因为 float 精度问题取不到第 11 格
        rx = Math.max(0, Math.min(1, rx));
        ry = Math.max(0, Math.min(1, ry));

        ry = 1.0 - ry; // Y轴反转
        
        targetX = rx; targetY = ry;
        isIdle = false;
        resetIdleTimer();
    }

    function resetIdleTimer() {
        if (idleTimer) clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
            targetX = 0.5; targetY = 0.5;
            isIdle = true; // 进入待机模式
        }, CONFIG.idleTime);
    }

    function animateLoop() {
        // 如果处于待机归位模式，使用更慢的系数，看起来像生物的“缓慢回神”
        const factor = isIdle ? CONFIG.idleSmoothing : CONFIG.smoothing;

        currentX += (targetX - currentX) * factor;
        currentY += (targetY - currentY) * factor;

        // 映射到 Grid 索引 (0 ~ 10)
        // 使用 floor 并不是最完美的，因为它导致最后一格很难选中
        // 优化算法：将 0~1 的连续区间均匀映射到 0~10 的离散区间
        let col = Math.min(Math.floor(currentX * CONFIG.cols), CONFIG.cols - 1);
        let row = Math.min(Math.floor(currentY * CONFIG.rows), CONFIG.rows - 1);

        const index = row * CONFIG.cols + col;
        if (index !== lastIndex) {
            renderFrame(index);
            lastIndex = index;
        }
        requestAnimationFrame(animateLoop);
    }

    function renderFrame(index) {
        const col = index % CONFIG.cols;
        const row = Math.floor(index / CONFIG.cols);
        const sx = col * frameW;
        const sy = row * frameH;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(gridImg, Math.floor(sx), Math.floor(sy), Math.floor(frameW), Math.floor(frameH), 0, 0, canvas.width, canvas.height);
    }

    function resizeStage(w, h) {
        const ratio = w / h;
        const maxW = window.innerWidth * 0.9;
        const maxH = window.innerHeight * 0.9;
        let finalW = w, finalH = h;
        if (finalH > maxH) { finalH = maxH; finalW = finalH * ratio; }
        if (finalW > maxW) { finalW = maxW; finalH = finalW / ratio; }
        stage.style.width = finalW + 'px';
        stage.style.height = finalH + 'px';
        canvas.width = w; canvas.height = h;
        lastIndex = -1;
    }
</script>
</body>
</html>
